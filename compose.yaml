services:
  db:
    image: postgres:18-alpine
    container_name: bazaarhub-db
    environment:
      POSTGRES_DB: bazaar-hub
      POSTGRES_USER: bazaar-hub-user
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
  api:
    image: bazaarhub-api:1.0
    ports:
      - "8082:8082"
    depends_on:
      - db